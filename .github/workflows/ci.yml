# Гейт качества: те же четыре проверки, что обязательны перед push вручную.
#
# Зачем: тесты §1/§2/§4/§5 security-беклога уже написаны, но запускать их было
# нечем — каталога .github/workflows/ не существовало, и следующий рефакторинг
# отломал бы их молча (docs/followups/2026-07-24-security-backlog.md, §7).
#
# Порядок шагов повторяет ручной: сначала тесты, потом типы сервера, потом типы
# клиента, и только затем сборка — падение видно на самом дешёвом шаге.

name: CI

on:
  push:
  pull_request:

# Пуш подряд в одну ветку не должен держать очередь: нужен результат по
# последнему коммиту, промежуточные прогоны отменяем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Та же мажорная версия, что в Dockerfile и .nvmrc.
          node-version: '20'
          cache: npm

      # Именно ci, а не install: ставит строго по lockfile и не правит его.
      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npx vitest run

      - name: Typecheck (server)
        run: npm run check

      - name: Typecheck (client)
        run: npm run check:client

      - name: Build
        run: npm run build

      # Аудит зависимостей и SBOM (§11, AI-42). Оба шага идут ПОСЛЕ npm ci:
      # npm sbom требует полностью установленного дерева и падает на частичном.
      #
      # continue-on-error намеренно: на 04.08 в production-дереве уже 22
      # находки (13 high), и они не следствие этой правки — блокирующий гейт
      # покрасил бы CI всем и сразу, не дав починить. Шаг сейчас отчётный;
      # снимать continue-on-error нужно отдельной задачей, после разбора
      # находок, иначе он бесполезен.
      - name: Dependency audit (production tree, reporting only)
        continue-on-error: true
        run: npm run audit:prod

      - name: SBOM (CycloneDX, production tree)
        run: npm run sbom > sbom.cyclonedx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

  # Скан секретов по файлам проверяемого коммита (§7, AI-37). Известные
  # исторические находки перечислены в .gitleaks.toml; всё новое — красный CI.
  # Версия закреплена той, которой делался исходный разбор находок.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (gitleaks)
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          detect --no-git --source /repo --config /repo/.gitleaks.toml --redact
