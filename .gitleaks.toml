# Конфиг secret scanning для CI (джоб secrets в .github/workflows/ci.yml).
#
# Allowlist — ТОЛЬКО известные исторические находки, зафиксированные при
# включении скана 30.07.2026 (56 штук, разбор в AI-37). Их ротация и чистка —
# AI-46. Новые пути сюда не добавлять без такого же разбора: если CI покраснел
# на живом коде, почти наверняка утёк настоящий секрет, а не «ложное
# срабатывание».

[extend]
useDefault = true

[allowlist]
description = "Исторические находки на момент включения скана; ротация — AI-46"
paths = [
  # Мёртвые миграционные скрипты и доки, не исполняются (см. CLAUDE.md).
  '''_archive/''',
  # Наследство n8n: экспорты воркфлоу с ключами эпохи старого прода.
  '''video-app/data/projects\.json''',
  '''scripts/youtube/''',
  # Примеры токенов в плане интеграции Facebook.
  '''docs/social_media/FACEBOOK_IMPLEMENTATION_PLAN\.md''',
  # Фикстуры теста OAuth-потока, значения заведомо фейковые.
  '''server/__tests__/youtube-oauth-flow\.test\.ts''',
  # Одноразовый самоподписанный сертификат для проверки транспорта Telegram
  # (AI-101 фаза 2C): поднимает локальный TLS-сервер на 127.0.0.2/127.0.0.3.
  # Ключ выпущен для этого теста, живёт только в нём и ничего не защищает.
  '''server/__tests__/telegram-2c-wire\.test\.ts''',
  # Вендоренный AWS SDK: примеры в d.ts-доках.
  '''custom_modules/''',
]
# Регэкспы сверяются с целой строкой, а не только с выделенным секретом.
regexTarget = "line"
regexes = [
  # Фейковый секрет в тестах вебхуков статуса.
  '''s3cret-from-env''',
  # Плейсхолдер поля VK-токена в UI (обрезанный, не настоящий).
  '''oauth\.vk\.com/blank\.html''',
  # Восстановление process.env.N8N_API_KEY в afterEach теста — не значение.
  '''process\.env\.N8N_API_KEY = savedN8nApiKey''',
]
