services:
  # ===========================================
  # TRAEFIK - Reverse Proxy + Let's Encrypt
  # ===========================================
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: always
    command:
      - "--log.level=INFO"
      - "--api=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.omemo.tech`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"

  # ===========================================
  # POSTGRES - Database
  # ===========================================
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    shm_size: 256mb
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=postgres
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # PGADMIN - PostgreSQL Admin
  # ===========================================
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGADMIN_DEFAULT_EMAIL=${SSL_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PASSWORD_PGADMIN}
    volumes:
      - ./pgadmin_data:/var/lib/pgadmin
    networks:
      - proxy
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.omemo.tech`)"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls=true"
      - "traefik.http.routers.pgadmin.tls.certresolver=letsencrypt"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"

  # ===========================================
  # DIRECTUS - Headless CMS
  # ===========================================
  directus:
    image: directus/directus:11.2.2
    container_name: directus
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - HOST=0.0.0.0
      - PORT=8055
      - PUBLIC_URL=https://directus.omemo.tech
      - SECRET=${DIRECTUS_SECRET}
      - DB_CLIENT=pg
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=directus
      - DB_USER=postgres
      - DB_PASSWORD=${DIRECTUS_DB_PASSWORD}
      - ADMIN_EMAIL=${DIRECTUS_ADMIN_EMAIL}
      - ADMIN_PASSWORD=${DIRECTUS_ADMIN_PASSWORD}
      - CORS_ENABLED=true
      - CORS_ORIGIN=true
      - CORS_METHODS=GET,POST,PATCH,DELETE
      - CORS_ALLOWED_HEADERS=Content-Type,Authorization
      - CORS_CREDENTIALS=true
      - ACCESS_TOKEN_TTL=24h
      - REFRESH_TOKEN_TTL=7d
    volumes:
      - ./directus_data:/directus/uploads
    networks:
      - proxy
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.directus.rule=Host(`directus.omemo.tech`) || Host(`directus.nplanner.ru`)"
      - "traefik.http.routers.directus.entrypoints=websecure"
      - "traefik.http.routers.directus.tls=true"
      - "traefik.http.routers.directus.tls.certresolver=letsencrypt"
      - "traefik.http.services.directus.loadbalancer.server.port=8055"
      - "traefik.docker.network=proxy"

  # ===========================================
  # SMM BACKEND - Node.js API (port 5000)
  # ===========================================
  smm:
    build:
      context: ..
      dockerfile: deploy/smm/Dockerfile
    container_name: smm
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Beget S3 Storage
      - BEGET_S3_ACCESS_KEY=${BEGET_S3_ACCESS_KEY}
      - BEGET_S3_SECRET_KEY=${BEGET_S3_SECRET_KEY}
      - BEGET_S3_BUCKET=${BEGET_S3_BUCKET}
      - BEGET_S3_ENDPOINT=${BEGET_S3_ENDPOINT:-https://s3.ru1.storage.beget.cloud}
      - BEGET_S3_REGION=${BEGET_S3_REGION:-ru-1}
      # Database
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${SMM_DB_NAME:-smm}
      # Directus Integration
      - DIRECTUS_URL=http://directus:8055
      - DIRECTUS_INTERNAL_URL=http://directus:8055
      - DIRECTUS_PUBLIC_URL=https://directus.omemo.tech
      # Gemini API
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_PROXY_URL=${GEMINI_PROXY_URL}
      - FORCE_GEMINI_PROXY=${FORCE_GEMINI_PROXY}
    volumes:
      - ./smm_uploads:/app/uploads
      - ./smm_logs:/app/logs
    networks:
      - proxy
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.smm.rule=Host(`smm.omemo.tech`)"
      - "traefik.http.routers.smm.entrypoints=websecure"
      - "traefik.http.routers.smm.tls=true"
      - "traefik.http.routers.smm.tls.certresolver=letsencrypt"
      - "traefik.http.services.smm.loadbalancer.server.port=5000"
      - "traefik.docker.network=proxy"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================
  # NGINX - Frontend static + API proxy
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    depends_on:
      - smm
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./smmniap_static:/usr/share/nginx/html:ro
    networks:
      - proxy
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx.rule=Host(`omemo.tech`) || Host(`www.omemo.tech`)"
      - "traefik.http.routers.nginx.entrypoints=websecure"
      - "traefik.http.routers.nginx.tls=true"
      - "traefik.http.routers.nginx.tls.certresolver=letsencrypt"
      - "traefik.http.services.nginx.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"

  # ===========================================
  # N8N - Workflow Automation
  # ===========================================
  n8n:
    build:
      context: .
      dockerfile: Dockerfile-n8n
    container_name: n8n
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - N8N_HOST=n8n.omemo.tech
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.omemo.tech/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Moscow}
      - DB_TYPE=postgresdb
      - DB_TABLE_PREFIX=n8n_
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=10000
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./local-files:/files
    networks:
      - proxy
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.omemo.tech`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      - "traefik.docker.network=proxy"

# ===========================================
# NETWORKS
# ===========================================
networks:
  proxy:
    name: proxy
    driver: bridge
  backend:
    name: backend
    driver: bridge
    internal: true
