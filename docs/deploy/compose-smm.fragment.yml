# Канон блока `smm` в `/root/docker-compose.yml` (AI-50).
#
# Сам compose-файл лежит ВНЕ репозитория, поэтому его нельзя закрепить обычным
# тестом. Здесь зафиксировано, как он обязан выглядеть, а проверяет это
# `scripts/deploy-smm.sh`: перед любыми действиями он читает effective config
# (`docker compose config`, то есть уже после подстановки .env и override) и
# отказывается работать, если у сервиса появилась секция `build:` или образ
# отличается от `root-smm:deployed`.
#
# ПОЧЕМУ НЕТ `build:`
#
# Docker берёт контекст сборки из рабочего каталога, а не из HEAD. Пока у
# сервиса есть `build:`, любой `docker compose up` может собрать образ из
# `/root/smm` — общего каталога, где в этот момент лежит чужой незакоммиченный
# WIP. 31.07.2026 в дереве так лежали `hermes_dashboard/`, `silentsentry_api/`
# и `smmniap_static/silentsentry/`; сборка оттуда унесла бы их в прод.
#
# Отсутствие `build:` делает эту ошибку невозможной, а не маловероятной:
# собрать образ может только deploy-скрипт, и только из временного worktree,
# созданного ровно на SHA из origin/main.
#
# ПОЧЕМУ АЛИАС, А НЕ КОНКРЕТНЫЙ SHA
#
# Образы тегируются как `root-smm:<full-sha>` и остаются в истории — на них
# можно откатиться. `root-smm:deployed` — подвижный указатель на текущий; его
# переставляет только deploy-скрипт под локом, сразу после повторной сверки
# origin/main. Так «что сейчас на проде» — одно место, а не результат гонки за
# общий тег `latest`.
#
# Остальные поля (env_file, labels traefik, command) в этом фрагменте опущены
# намеренно: их канон живёт в самом /root/docker-compose.yml, здесь только то,
# что относится к источнику образа.

services:
  smm:
    image: root-smm:deployed
    container_name: smm
    restart: always
    # api.telegram.org: пин рабочего IP. Без него плановая публикация
    # встанет — клиент ходит на api.telegram.org одной A-записью без
    # перебора. Пин снимается задачей AI-101 после миграции всех путей.
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    # build: — намеренно отсутствует, см. выше. Добавление вернёт footgun и
    # будет отклонено preflight-проверкой deploy-скрипта.
