    <!-- React App Implementation -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Demo Data for the Sandbox
        const DEMO_TRACKS = [
            {
                id: 'darknet-diaries',
                title: 'Darknet Diaries — Ep. 142: Silent Signal',
                duration: '42:15',
                url: 'https://feeds.megaphone.fm/darknetdiaries',
                status: 'compromised',
                beaconType: 'SilverPush Tracker Sweep (19.45 kHz)',
                beaconProbability: 0.94,
                frequency: '19,450 Hz'
            },
            {
                id: 'huberman-lab',
                title: 'The Huberman Lab — Ultrasonic Biometrics & Sleep',
                duration: '2:14:10',
                url: 'https://feeds.megaphone.fm/huberman',
                status: 'compromised',
                beaconType: 'Shopkick SmartBeacon Pulse (20.10 kHz)',
                beaconProbability: 0.81,
                frequency: '20,100 Hz'
            },
            {
                id: 'secure-podcast',
                title: 'The Daily Privacy Audit — Episode 12 (Clean)',
                duration: '18:32',
                url: 'https://privacy.example.org/feed.xml',
                status: 'secure',
                beaconType: 'None Detected',
                beaconProbability: 0.02,
                frequency: 'N/A'
            }
        ];

        function SilentSentryApp() {
            // State
            const [selectedTrack, setSelectedTrack] = useState(null);
            const [inputUrl, setInputUrl] = useState('');
            const [isFileDragged, setIsFileDragged] = useState(false);
            const [uploadedFile, setUploadedFile] = useState(null);
            const [uploadedFileName, setUploadedFileName] = useState('');
            
            const [appState, setAppState] = useState('idle'); // idle, scanning, scanned, sanitizing, sanitized
            const [errorMsg, setErrorMsg] = useState('');
            
            // Backend Response States
            const [backendReport, setBackendReport] = useState(null);

            // Simulation Parameters
            const [filterCutoff, setFilterCutoff] = useState(18000);
            const [filterOrder, setFilterOrder] = useState('Butterworth 48dB/oct');
            const [fftResolution, setFftResolution] = useState(8192);

            // Ref for Spectrogram Canvas
            const canvasRef = useRef(null);
            const animationRef = useRef(null);

            // Spectrogram visualization loop
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let width = canvas.width = canvas.parentElement.clientWidth;
                let height = canvas.height = 240;

                let frame = 0;
                
                // Helper to draw the sound wave frequencies
                const draw = () => {
                    frame++;
                    ctx.fillStyle = '#07080a';
                    ctx.fillRect(0, 0, width, height);

                    // Grid lines (Horizontal frequency lines)
                    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
                    ctx.lineWidth = 1;
                    const gridCount = 5;
                    for (let i = 1; i < gridCount; i++) {
                        const y = (height / gridCount) * i;
                        ctx.beginPath();
                        ctx.moveTo(0, y);
                        ctx.lineTo(width, y);
                        ctx.stroke();

                        // Frequency Labels
                        ctx.fillStyle = 'rgba(255,255,255,0.2)';
                        ctx.font = '9px monospace';
                        const freq = Math.round(22000 - (22000 / gridCount) * i);
                        ctx.fillText(`${freq} Hz`, 10, y - 4);
                    }

                    // Draw Frequency Spectrum Heatmap (Waterfall style / wave bars)
                    const barWidth = 3;
                    const numBars = Math.floor(width / (barWidth + 1));
                    
                    for (let i = 0; i < numBars; i++) {
                        const x = i * (barWidth + 1);
                        const progressRatio = i / numBars;
                        const currentFreq = progressRatio * 22000;

                        // Ambient human voice frequency wave heights
                        let waveHeight = 0;
                        if (currentFreq < 4000) {
                            waveHeight = Math.sin(frame * 0.05 + i * 0.1) * 40 + Math.cos(frame * 0.02 + i * 0.05) * 20 + 80;
                        } else if (currentFreq < 12000) {
                            waveHeight = Math.sin(frame * 0.08 + i * 0.2) * 20 + 30;
                        } else if (currentFreq < 18000) {
                            waveHeight = Math.sin(frame * 0.12 + i * 0.3) * 8 + 10;
                        } else {
                            waveHeight = Math.sin(frame * 0.2 + i * 0.4) * 3 + 4;
                        }

                        // Cap to container
                        waveHeight = Math.max(2, waveHeight);

                        // If NOT sanitized, inject the HIDDEN ULTRASONIC BEACON frequency band
                        let isBeaconBand = false;
                        if (appState !== 'sanitized') {
                            let targetBeaconFreq = 19450;
                            if (selectedTrack?.id === 'huberman-lab') {
                                targetBeaconFreq = 20100;
                            } else if (backendReport?.scan_before?.beacon_detected) {
                                // Real file analysis found beacons
                                targetBeaconFreq = 19800; // General representation
                            }

                            const hasActiveBeacon = selectedTrack ? (selectedTrack.status === 'compromised') : (backendReport ? backendReport.scan_before.beacon_detected : true);

                            if (hasActiveBeacon && Math.abs(currentFreq - targetBeaconFreq) < 250 && (appState === 'scanning' || appState === 'scanned' || appState === 'sanitizing')) {
                                isBeaconBand = true;
                                // Pulsing high energy beacon spike
                                waveHeight += 95 + Math.sin(frame * 0.2) * 35;
                            }
                        }

                        // Apply Lowpass Visual Cutoff filter if Sanitized
                        if (appState === 'sanitized' && currentFreq > filterCutoff) {
                            waveHeight *= 0.01; // Steep drop
                        }

                        // Determine Color
                        let color = 'rgba(99, 102, 241, 0.4)'; // Default cool purple
                        if (isBeaconBand) {
                            color = `rgba(239, 68, 68, ${0.7 + Math.sin(frame * 0.2) * 0.3})`; // Danger pulsing neon red
                        } else if (currentFreq > filterCutoff && appState === 'sanitized') {
                            color = 'rgba(255, 255, 255, 0.03)';
                        } else if (appState === 'sanitized') {
                            color = 'rgba(16, 185, 129, 0.4)'; // Safe green
                        }

                        ctx.fillStyle = color;
                        ctx.fillRect(x, height - waveHeight, barWidth, waveHeight);
                    }

                    // Draw the 18kHz Safe Cutoff Line if active
                    if (appState === 'sanitized' || appState === 'sanitizing') {
                        const cutoffY = height - (filterCutoff / 22000) * height;
                        ctx.strokeStyle = 'rgba(16, 185, 129, 0.5)';
                        ctx.lineWidth = 1.5;
                        ctx.setLineDash([5, 5]);
                        ctx.beginPath();
                        ctx.moveTo(0, cutoffY);
                        ctx.lineTo(width, cutoffY);
                        ctx.stroke();
                        ctx.setLineDash([]);
                        
                        ctx.fillStyle = '#10b981';
                        ctx.font = '10px monospace';
                        ctx.fillText(`🛡️ LOW-PASS PRIVACY SHIELD CUTOFF: ${filterCutoff / 1000} kHz`, width - 290, cutoffY - 6);
                    }

                    animationRef.current = requestAnimationFrame(draw);
                };

                draw();

                return () => {
                    cancelAnimationFrame(animationRef.current);
                };
            }, [appState, selectedTrack, backendReport, filterCutoff]);

            // Handlers
            const handleLoadTrack = (track) => {
                setSelectedTrack(track);
                setUploadedFile(null);
                setUploadedFileName('');
                setAppState('idle');
                setErrorMsg('');
                setBackendReport(null);
            };

            const handleAnalyze = async () => {
                if (!selectedTrack && !uploadedFile) {
                    setErrorMsg('Please select a podcast or drop an audio file first.');
                    return;
                }
                
                setErrorMsg('');
                setAppState('scanning');

                if (uploadedFile) {
                    // REAL MODE: upload and process via the FastAPI backend!
                    const formData = new FormData();
                    formData.append('file', uploadedFile);

                    try {
                        const response = await fetch('/api/full', {
                            method: 'POST',
                            body: formData
                        });

                        if (!response.ok) {
                            const errText = await response.text();
                            throw new Error(errText || 'Backend processing failed.');
                        }

                        const data = await response.json();
                        setBackendReport(data);
                        setAppState('scanned');
                    } catch (err) {
                        setErrorMsg(`API Sanitization Error: ${err.message}`);
                        setAppState('idle');
                    }
                } else if (selectedTrack && selectedTrack.id === 'scraped-url') {
                    // REAL RSS SCRAPE MODE!
                    try {
                        const response = await fetch('/api/rss', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                feed_url: selectedTrack.url,
                                episode_index: 0
                            })
                        });

                        if (!response.ok) {
                            const errText = await response.text();
                            throw new Error(errText || 'RSS processing failed.');
                        }

                        const data = await response.json();
                        setBackendReport(data);
                        setAppState('scanned');
                    } catch (err) {
                        setErrorMsg(`API RSS Scraping Error: ${err.message}`);
                        setAppState('idle');
                    }
                } else {
                    // DEMO MODE: simulate scanning delay
                    setTimeout(() => {
                        setAppState('scanned');
                    }, 2800);
                }
            };

            const handleSanitize = () => {
                setAppState('sanitizing');
                setTimeout(() => {
                    setAppState('sanitized');
                }, 3500);
            };

            const handleReset = () => {
                setAppState('idle');
                setSelectedTrack(null);
                setUploadedFile(null);
                setUploadedFileName('');
                setInputUrl('');
                setBackendReport(null);
            };

            const handleUrlSubmit = (e) => {
                e.preventDefault();
                if (!inputUrl) return;
                
                // Simulate an error check (friendly error card style!)
                if (!inputUrl.startsWith('http://') && !inputUrl.startsWith('https://')) {
                    setErrorMsg('Invalid Podcast RSS/Audio URL. Source stream could not be resolved.');
                    return;
                }

                setErrorMsg('');
                setSelectedTrack({
                    id: 'scraped-url',
                    title: `RSS Feed: ${inputUrl.split('/').pop() || 'Podcast Stream'}`,
                    duration: 'Latest Episode',
                    url: inputUrl,
                    status: 'compromised',
                    beaconType: 'Ultrasonic Beacons Checked Live On Server',
                    beaconProbability: 0.92,
                    frequency: 'Scanning Live...'
                });
                setAppState('idle');
            };

            const handleFileDrop = (e) => {
                e.preventDefault();
                setIsFileDragged(false);
                const file = e.dataTransfer.files[0];
                if (file) {
                    setUploadedFile(file);
                    setUploadedFileName(file.name);
                    setSelectedTrack(null);
                    setAppState('idle');
                    setBackendReport(null);
                }
            };

            const handleFileSelect = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setUploadedFile(file);
                    setUploadedFileName(file.name);
                    setSelectedTrack(null);
                    setAppState('idle');
                    setBackendReport(null);
                }
            };

            return (
                <div className="relative min-h-screen bg-void text-gray-100 flex flex-col justify-between overflow-hidden">
                    {/* Glowing backgrounds */}
                    <div className="absolute top-0 left-0 w-full h-full pointer-events-none z-0">
                        <div className="absolute top-[-10%] left-[-10%] w-[60%] h-[60%] rounded-full ambient-glow-1"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] rounded-full ambient-glow-2"></div>
                    </div>

                    {/* Navigation Header */}
                    <header className="relative z-10 w-full max-w-7xl mx-auto px-6 py-6 border-b border-white/5 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded-full bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center">
                                <span className="font-mono text-indigo-400 font-bold">S⚔️S</span>
                            </div>
                            <div>
                                <h1 className="text-xl font-bold tracking-tight text-white font-mono flex items-center space-x-2">
                                    <span>SilentSentry</span>
                                    <span className="text-[9px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full uppercase tracking-wider font-bold">Live MVP</span>
                                </h1>
                                <p className="text-[10px] text-gray-400 font-mono tracking-wide uppercase">Ultrasonic Shield & Audio Sanitizer</p>
                            </div>
                        </div>
                        <nav className="hidden md:flex space-x-6 text-sm font-medium text-gray-400">
                            <a href="#product" className="hover:text-white transition-colors">Concept</a>
                            <a href="#sandbox" className="hover:text-white transition-colors">Interactive Sandbox</a>
                            <a href="#tech" className="hover:text-white transition-colors">Technology</a>
                            <a href="#monetization" className="hover:text-white transition-colors">Pricing</a>
                        </nav>
                        <div>
                            <button onClick={() => alert('SilentSentry REST API is live under https://roboflow.space/api/')} className="px-4 py-2 rounded-full border border-white/10 text-xs font-mono font-medium hover:bg-white/5 transition-all text-gray-300 flex items-center space-x-2">
                                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                <span>FastAPI Backend Connected</span>
                            </button>
                        </div>
                    </header>

                    {/* Main Content Container */}
                    <main className="relative z-10 w-full max-w-7xl mx-auto px-6 py-12 flex-1 flex flex-col justify-center space-y-16">
                        
                        {/* Hero Introduction */}
                        <section id="product" className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                            <div className="lg:col-span-7 space-y-6">
                                <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs font-mono">
                                    <span>🕵️‍♂️ THE THREAT IS SILENT</span>
                                </div>
                                <h2 className="text-4xl md:text-5xl lg:text-6xl font-thin tracking-tight leading-tight text-white font-sans">
                                    Clean your podcasts of <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-rose-400 to-amber-300 font-medium">Silent Tracking Beacons</span>
                                </h2>
                                <p className="text-gray-400 text-lg max-w-2xl leading-relaxed">
                                    Ad-tech giants insert high-frequency silent audio tones (<strong className="text-gray-200">19–22 kHz</strong>) into podcasts and TV streams. When played, your phone's microphone secretly listens to these beacons, matching your physical presence to cross-device profiles.
                                </p>
                                <div className="text-gray-400 text-sm font-mono border-l-2 border-indigo-500/30 pl-4 py-1">
                                    SilentSentry uses brickwall high-cutoff low-pass filters to purge these tracking beacons instantly, leaving premium human speech and musical frequencies 100% untouched.
                                </div>
                                <div className="flex flex-wrap gap-4">
                                    <a href="#sandbox" className="px-6 py-3 rounded-full bg-indigo-600 hover:bg-indigo-500 text-sm font-medium transition-all shadow-lg hover:shadow-indigo-500/10 flex items-center space-x-2">
                                        <span>Try Live Sandbox</span>
                                        <span>→</span>
                                    </a>
                                    <a href="#monetization" className="px-6 py-3 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-sm font-medium transition-all flex items-center space-x-2">
                                        <span>Explore Business Model</span>
                                    </a>
                                </div>
                            </div>
                            
                            {/* Threat Card / Visual Graphic */}
                            <div className="lg:col-span-5 premium-card rounded-2xl p-6 space-y-6">
                                <div className="flex items-center justify-between border-b border-white/5 pb-4">
                                    <div className="flex items-center space-x-2 font-mono text-xs">
                                        <span className="text-indigo-400">📊 SPECTRAL ANALYSIS</span>
                                    </div>
                                    <span className="text-[10px] font-mono text-rose-400 bg-rose-500/10 px-2 py-0.5 rounded border border-rose-500/20">Active Risk</span>
                                </div>
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center bg-white/5 p-3 rounded-lg border border-white/5">
                                        <div>
                                            <div className="text-xs font-semibold">Cross-Device Tracking (xDT)</div>
                                            <div className="text-[10px] text-gray-400">Silent acoustic ultrasound pairings</div>
                                        </div>
                                        <div className="text-right text-rose-400 font-mono text-xs font-bold">19kHz - 21.5kHz</div>
                                    </div>
                                    <div className="flex justify-between items-center bg-white/5 p-3 rounded-lg border border-white/5">
                                        <div>
                                            <div className="text-xs font-semibold">Human Hearing Cap</div>
                                            <div className="text-[10px] text-gray-400">Max range for adult humans</div>
                                        </div>
                                        <div className="text-right text-gray-300 font-mono text-xs">~17.5 kHz</div>
                                    </div>
                                    <div className="flex justify-between items-center bg-white/5 p-3 rounded-lg border border-white/5">
                                        <div>
                                            <div className="text-xs font-semibold">Standard Podcast Compression</div>
                                            <div className="text-[10px] text-gray-400">MP3 / AAC encoders retain ultrasound</div>
                                        </div>
                                        <div className="text-right text-amber-400 font-mono text-xs">Unfiltered Leak</div>
                                    </div>
                                </div>
                                <div className="text-xs text-gray-400 leading-relaxed bg-indigo-950/20 p-4 rounded-xl border border-indigo-500/10">
                                    <strong>How they tracking you:</strong> You play a podcast on your TV/Computer. The hidden audio tone sweeps through the room. Your mobile phone's background Facebook/SDK-enabled app captures the tone and instantly pairs your devices together.
                                </div>
                            </div>
                        </section>

                        {/* Interactive Sandbox Simulator */}
                        <section id="sandbox" className="space-y-8 scroll-mt-6">
                            <div className="text-center space-y-2">
                                <h3 className="text-3xl font-thin tracking-tight font-sans text-white">Live Sentry MVP Sandbox</h3>
                                <p className="text-gray-400 max-w-xl mx-auto text-sm">
                                    Upload your own MP3/WAV file or paste an active XML Podcast RSS Feed to scan, filter and download sanitized streams!
                                </p>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                                
                                {/* Left column: Source Selection & Controls */}
                                <div className="lg:col-span-4 space-y-6">
                                    <div className="premium-card rounded-2xl p-6 space-y-6">
                                        <h4 className="text-sm font-semibold font-mono border-b border-white/5 pb-3 flex items-center space-x-2">
                                            <span>⚡</span>

                                        </h4>
                                        
                                        {/* Preset Demo tracks */}

                                            <label className="text-[11px] font-mono text-gray-400 uppercase tracking-wider block">Preset Audios (Simulated Beacons)</label>
                                            <div className="grid grid-cols-1 gap-2">

                                                    <button

                                                            selectedTrack?.id === track.id

                                                    >

                                                            <div className="text-[10px] text-gray-400">Duration: {track.duration}</div>

                                                        <span className={`px-2 py-0.5 rounded-[4px] font-mono text-[9px] uppercase tracking-wider font-bold border ${

                                                                ? 'bg-rose-500/10 border-rose-500/20 text-rose-300'

                                        {/* Divider */}

                                            <span>OR</span>
                                            <div className="h-[1px] bg-white/5 flex-1 ml-3"></div>
                                        </div>

                                        {/* Custom URL Input */}
                                        <form onSubmit={handleUrlSubmit} className="space-y-3">
                                            <label className="text-[11px] font-mono text-gray-400 uppercase tracking-wider block">Scrape RSS Podcast Feed Live</label>
                                            <div className="flex gap-2">
                                                <input
                                                    type="text"
                                                    value={inputUrl}
